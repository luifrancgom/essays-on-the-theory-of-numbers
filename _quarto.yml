project:
  type: book
  output-dir: _book

book:
  title: Essays on the theory of numbers
  author: Richard Dedekind
  date: 1901-01-01
  date-format: "YYYY"
  downloads: [pdf]
  chapters:
    - index.qmd  
    - part: 1_00_continuity-and-irrational-numbers.qmd
      chapters:
        - 1_01_properties-of-rational-numbers.qmd
        - 1_02_comparison-with-points-of-a-straight-line.qmd
        - 1_03_continuity-of-the-straight-line.qmd
        - 1_04_creation-of-irrational-numbers.qmd
        - 1_05_continuity-of-the-domain-of-real-numbers.qmd
        - 1_06_operations-with-real-numbers.qmd
        - 1_07_infinitesimal-analysis.qmd
    - part: 2_00_the-nature-and-meaning-of-numbers.qmd
      chapters:
        - 2_01_systems-of-elements.qmd
        - 2_02_transformation-of-a-system.qmd
        - 2_03_similarity-of-a-transformation.qmd
        - 2_04_transformation-of-a-system-in-itself.qmd
        - 2_05_the-finite-and-infinite.qmd
        - 2_06_simply-infinite-systems.qmd
        - 2_07_greater-and-less-numbers.qmd
        - 2_08_finite-and-infinite-parts.qmd
        - 2_09_definition-by-induction.qmd
        - 2_10_class-of-simply-infinite-systems.qmd
        - 2_11_addition-of-numbers.qmd
        - 2_12_multiplication-of-numbers.qmd
        - 2_13_involution-of-numbers.qmd
        - 2_14_number-of-elements-of-a-finite-system.qmd
    - references.qmd

bibliography: references/essays-on-the-theory-of-numbers.bib
csl: references/ieee.csl

format:
  html:
    theme:
      - cosmo
      - scss/custom.scss
  pdf:
    # layout
    documentclass: scrbook



